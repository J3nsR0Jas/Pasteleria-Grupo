<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Pastelería Delicia</title>
<link rel="stylesheet" href="css/registro_clientes.css">
</head>
<body>

<header class="encabezado" id="encabezado">
  <div class="contenedor barra-nav">
    <a href="index.html" class="marca">Pastelería <span>Delicia</span></a>
  </div>
</header>

<main>
  <div class="contenedor">
    <div class="panel-formulario">
      <h2>Crear cuenta</h2>
      <form class="formulario" id="formulario-crear" novalidate>
        <div class="campo">
          <label for="nombre-crear">Nombre completo</label>
          <input type="text" id="nombre-crear" name="nombre" required>
          <span class="error" id="error-nombre-crear"></span>
        </div>
        <div class="campo">
          <label for="correo-crear">Correo</label>
          <input type="email" id="correo-crear" name="correo" required>
          <span class="error" id="error-correo-crear"></span>
        </div>
        <div class="campo">
          <label for="contrasena-crear">Contraseña</label>
          <input type="password" id="contrasena-crear" name="contrasena" required minlength="4">
          <span class="error" id="error-contrasena-crear"></span>
        </div>
        <button type="submit" class="boton">Crear cuenta</button>
        <div class="mensaje-estado" id="mensaje-crear"></div>
      </form>
      <p class="enlace-secundario">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </div>
</main>

<footer class="pie"><div class="contenedor"><p>Pastelería Delicia · Huancayo, Perú · Ejemplo con fines didácticos.</p></div></footer>

<script type="module" src="js/registro_clientes.js"></script>
</body>
</html>
