<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Pastelería Delicia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

<link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<header class="encabezado sticky-top" id="encabezado">
  <div class="contenedor barra-nav d-flex align-items-center justify-content-between py-3">
    <a href="index.html" class="marca fw-bold text-decoration-none fs-4">Pastelería <span class="fg-primary">Delicia</span></a>
  </div>
</header>

<main class="flex-grow-1 d-flex align-items-center py-5">
  <div class="contenedor">
    <div class="panel-formulario card border-0 shadow-sm mx-auto p-4 p-md-5">
      <h2 class="fw-bold fs-3 text-dark text-center mb-4">Iniciar sesión</h2>
      
      <form class="formulario d-flex flex-column gap-3" id="formulario-ingresar" novalidate>
        <div class="campo">
          <label for="correo-ingresar" class="form-label fw-semibold text-dark fs-7">Correo electrónico</label>
          <input type="email" id="correo-ingresar" name="correo" class="form-control form-control-lg rounded-3" placeholder="ejemplo@correo.com" required>
          <span class="error text-danger small mt-1 d-block" id="error-correo-ingresar"></span>
        </div>

        <div class="campo">
          <label for="contrasena-ingresar" class="form-label fw-semibold text-dark fs-7">Contraseña</label>
          <input type="password" id="contrasena-ingresar" name="contrasena" class="form-control form-control-lg rounded-3" placeholder="••••••••" required minlength="4">
          <span class="error text-danger small mt-1 d-block" id="error-contrasena-ingresar"></span>
        </div>

        <button type="submit" class="btn btn-solid theme-primary rounded-pill fw-bold py-2 mt-2 w-100 fs-6">Ingresar</button>
        <div class="mensaje-estado rounded-3 p-3 text-center fs-7 mt-2" id="mensaje-ingresar"></div>
      </form>

      <p class="enlace-secundario text-center mt-4 mb-0 fs-7 text-muted">
        ¿No tienes cuenta? <a href="registro_clientes.html" class="fw-bold text-decoration-none">Créala aquí</a>
      </p>
    </div>
  </div>
</main>

<footer class="pie py-4 bg-dark text-light mt-auto">
  <div class="contenedor text-center opacity-75 fs-7">
    <p class="m-0">Pastelería Delicia · Huancayo, Perú · Ejemplo con fines didácticos.</p>
  </div>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script type="module" src="js/login.js"></script>
</body>
</html>
