<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Pastelería Delicia</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="encabezado" id="encabezado">
  <div class="contenedor barra-nav">
    <a href="index.html" class="marca">Pastelería <span>Delicia</span></a>
  </div>
</header>

<main>
  <div class="contenedor">
    <div class="panel-formulario">
      <h2>Iniciar sesión</h2>
      <form class="formulario" id="formulario-ingresar" novalidate>
        <div class="campo">
          <label for="correo-ingresar">Correo</label>
          <input type="email" id="correo-ingresar" name="correo" required>
          <span class="error" id="error-correo-ingresar"></span>
        </div>
        <div class="campo">
          <label for="contrasena-ingresar">Contraseña</label>
          <input type="password" id="contrasena-ingresar" name="contrasena" required minlength="4">
          <span class="error" id="error-contrasena-ingresar"></span>
        </div>
        <button type="submit" class="boton">Ingresar</button>
        <div class="mensaje-estado" id="mensaje-ingresar"></div>
      </form>
      <p class="enlace-secundario">¿No tienes cuenta? <a href="registro_clientes.html">Créala aquí</a></p>
    </div>
  </div>
</main>

<footer class="pie"><div class="contenedor"><p>Pastelería Delicia · Huancayo, Perú · Ejemplo con fines didácticos.</p></div></footer>

<script type="module" src="js/login.js"></script>
</body>
</html>
