<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Pastelería Delicia</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-pagina d-flex flex-column min-vh-100 position-relative overflow-x-hidden">

  <div class="fondo-animado">
    <div class="burbuja b1"></div>
    <div class="burbuja b2"></div>
    <div class="burbuja b3"></div>
  </div>

  <header class="encabezado sticky-top shadow-sm" id="encabezado">
    <div class="contenedor d-flex align-items-center justify-content-between py-3">
      <a href="index.html" class="marca fw-bold text-decoration-none fs-4">Pastelería <span class="fg-primary">Delicia</span></a>
    </div>
  </header>

  <main class="flex-grow-1 d-flex align-items-center py-5 position-relative z-1">
    <div class="contenedor">
      <div class="panel-formulario card border-0 mx-auto p-4 p-md-5 rounded-5">
        <div class="text-center mb-4">
          <span class="icono-bienvenida d-inline-block mb-2">🧁</span>
          <h2 class="fw-bold fs-3 text-dark m-0">¡Hola de nuevo!</h2>
          <p class="text-muted small">Ingresa tus datos para continuar</p>
        </div>
        
        <form class="formulario d-flex flex-column gap-3" id="formulario-ingresar" novalidate>
          <div class="campo position-relative">
            <label for="correo-ingresar" class="form-label fw-semibold text-dark fs-7 mb-1">Correo electrónico</label>
            <input type="email" id="correo-ingresar" name="correo" class="form-control form-control-lg rounded-4 px-3" placeholder="ejemplo@correo.com" required>
            <span class="error text-danger small mt-1 d-block" id="error-correo-ingresar"></span>
          </div>

          <div class="campo position-relative">
            <label for="contrasena-ingresar" class="form-label fw-semibold text-dark fs-7 mb-1">Contraseña</label>
            <input type="password" id="contrasena-ingresar" name="contrasena" class="form-control form-control-lg rounded-4 px-3" placeholder="••••••••" required minlength="4">
            <span class="error text-danger small mt-1 d-block" id="error-contrasena-ingresar"></span>
          </div>

          <button type="submit" class="btn btn-primary rounded-pill fw-bold py-3 mt-3 w-100 fs-6 shadow-btn">
            <span>Ingresar</span>
          </button>
          <div class="mensaje-estado rounded-4 p-3 text-center fs-7 mt-2" id="mensaje-ingresar"></div>
        </form>

        <p class="enlace-secundario text-center mt-4 mb-0 fs-7 text-muted">
          ¿No tienes cuenta? <a href="registro_clientes.html" class="fw-bold text-decoration-none fg-primary link-animado">Créala aquí</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="pie py-4 bg-dark text-light mt-auto position-relative z-1">
    <div class="contenedor text-center opacity-75 fs-7">
      <p class="m-0">Pastelería Delicia · Huancayo, Perú · Ejemplo con fines didácticos.</p>
    </div>
  </footer>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
