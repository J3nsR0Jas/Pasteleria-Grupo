<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis pedidos — Pastelería Delicia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

<link rel="stylesheet" href="css/consulta_pedido.css">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<header class="encabezado sticky-top" id="encabezado">
  <div class="contenedor barra-nav d-flex align-items-center justify-content-between py-3">
    <a href="index.html" class="marca fw-bold text-decoration-none fs-4">Pastelería <span class="fg-primary">Delicia</span></a>
    
    <div class="d-flex align-items-center gap-3">
      <ul class="nav-links list-unstyled m-0 p-0">
        <li><a href="registro_pedido.html" class="text-decoration-none fw-semibold">Nuevo pedido</a></li>
      </ul>
      <button class="btn btn-outline-dark rounded-pill fw-bold px-3" id="boton-salir" type="button">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="seccion-consulta flex-grow-1 py-5">
  <div class="contenedor">
    <h1 class="fw-bold fs-2 text-dark mb-4">Mis pedidos</h1>
    
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
      <div class="table-responsive">
        <table class="tabla-pedidos table table-hover align-middle m-0">
          <thead>
            <tr>
              <th>Código</th>
              <th>Producto</th>
              <th>Tamaño</th>
              <th>Sabor</th>
              <th>Entrega</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla-pedidos"></tbody>
        </table>
      </div>
    </div>

    <p id="sin-pedidos" class="alert alert-info mt-4">Todavía no tienes pedidos registrados.</p>
    <div class="mensaje-estado rounded-3 p-3 mt-3 fs-7" id="mensaje-consulta"></div>
  </div>
</main>

<footer class="pie py-4 bg-dark text-light mt-auto">
  <div class="contenedor text-center opacity-75 fs-7">
    <p class="m-0">Pastelería Delicia · Huancayo, Perú · Ejemplo con fines didácticos.</p>
  </div>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script type="module" src="js/consulta_pedido.js"></script>
</body>
</html>
